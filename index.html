<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #9ed4f2; }

  #mini i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  #net { bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 600; opacity: .9; white-space: nowrap; }
  #hint { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 26px); left: 0; right: 0; text-align: center; font-size: 17px; padding: 0 16px; }
  #msg { top: 24%; left: 0; right: 0; text-align: center; font-size: 50px; color: #ffe14d; -webkit-text-stroke: 1.5px #5a3b00; transition: opacity .3s, transform .3s; opacity: 0; transform: scale(.75); }
  #msg.on { opacity: 1; transform: scale(1); } #msg small { display: block; font-size: 22px; -webkit-text-stroke: 0; color: #fff; }
  #cross { position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px #0006, inset 0 0 0 2px #0006; pointer-events: none; display: none; }
  #cross::before, #cross::after { content: ""; position: absolute; background: currentColor; left: 50%; top: 50%; }
  #cross::before { width: 2px; height: 46px; margin: -23px 0 0 -1px; } #cross::after { width: 46px; height: 2px; margin: -1px 0 0 -23px; }

  .card h2 { margin: 0 0 10px; font-size: 24px; }

</style>

<body>
<div id="vignette"></div>
<div id="cross"></div>
<div class="hud" id="round"></div>
<div class="hud" id="wind"></div>
<div class="hud" id="mini"></div>
<div class="hud" id="hint"></div>

<div id="over" hidden><div class="card">
  <h2 id="overTitle">Final scores</h2>
  <table id="table"></table>

  <p id="next"></p>
  <button class="go" id="again">Play again</button>
</div></div>
<script type="module">
/* ═══ ARCHERY RANGE · a Multiplayer Agent starter ═════════════════════════════════════════
 * Take turns shooting at one target. The wind changes every arrow and the target moves
 * further back every round. Turn-based, 2–6 players; bots take the empty places.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ rounds and distances, wind, sway, the target, timings, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SCORING ....... rings, totals, whose turn it is
 *   FLIGHT ........ where an arrow is at any moment: aim point, gravity, the wind's push
 *   RANGE ......... renderer, sky, grass, distance lines, trees, flags, the target
 *   ARCHERS ....... the archer and arrow models
 *   GAME (HOST) ... turns, checking and scoring shots, wind, rounds, bots, results.
 *                   Only the host writes the shared `game` field.
 *   MY TURN ....... drawing the bow, aiming, sway, letting go
 *   HUD & RESULTS . round, wind, standings, crosshair, results card, leaderboard
 *   INPUT / LOOP .. pointer and keys, the cameras, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The whole match lives in ONE shared field, `game`: {id, v, phase, round, seats, hits,
 *     shot, shotN, wind, turnAt, endsAt}. `seats` holds each archer's id, name, color, arrow
 *     scores and bullseye count; `hits` the arrows in the target this round. Only the HOST
 *     writes it, and `v` goes up on every write.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. A new host carries on from `game`.
 *   - The archer whose turn it is sends the intent "shoot" {g, n, x, y}: the point on the
 *     target it aimed at. The host checks the turn, adds the wind's push, scores the hit and
 *     writes `game.shot`. Every client then flies that arrow on the same path, so everyone
 *     watches it land. After a moment the host files it and the next archer is up.
 *   - Each player writes its OWN entity: `n`/`c` (name, color), `hb` (heartbeat) and, while
 *     it draws, `a` (its crosshair, ~12 times a second) so the others watch it aim.
 *   - A place whose player is gone for 10s goes to a bot (it keeps the score); someone who
 *     joins takes a bot's place, or a new one in round 1, or watches.
 *   - Intent "again" {} from the results card asks the host to start a new match now.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "archery-total": each player's best total, shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 3,              // bots fill the line up to this many archers
  maxSeats: 6,           // the most archers in one match
  distances: [18, 30, 42, 55, 70], // metres to the target, one per round
  arrowsPerRound: 3,     // arrows each archer shoots per round (one per turn, taking turns)
  windMax: [2, 3, 4, 5, 6], // strongest wind per round, m/s
  windPush: 0.2,         // sideways push per m/s of wind, m/s²
  arrowSpeed: 50,        // m/s
  minFlight: 0.8,        // short flights are shown in slow motion so they last at least this long, s
  sway: 0.06, swayPerM: 0.0035, // how far the aim wobbles: base + per metre of distance
  aimFeel: 0.6,          // how far the crosshair moves for a drag (1 = follows the finger)
  minDraw: 300,          // ms the bow must be drawn before it can shoot
  targetR: 0.61,         // the target face's radius (ten rings)
  targetY: 1.3,          // its centre's height
  bossHalf: 0.75,        // the straw block behind it (a miss that hits it still sticks)
  holdMs: 1700,          // ms the camera stays on the target after an arrow lands
  turnMs: 25000,         // a player who doesn't shoot in this long gets a shot made for them
  seatGraceMs: 10000,    // a seated player silent this long loses the place to a bot
  resultsMs: 30000,      // results show this long, then a new match starts (Play again starts it at once)
  botThinkMs: 2600,      // a bot waits this long before it shoots...
  botDrawMs: 1700,       // ...drawing and aiming for the last part of it
  botAim: 0.07, botAimPerM: 0.0028, // how far bots miss: base + per metre, metres
  botWindErr: 0.3,       // bots misjudge the wind by up to this share
  botNames: ["Robin", "Arrowhead", "Fletcher", "Bullseye Bo", "Quiver", "Longbow"],
  board: "archery-total",
};
const COLORS = ["#ff4d6d", "#4dabff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#3de0d0", "#f5f5f5"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'archery-range',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
/** JSON from a state field, parsed once per distinct value (read-only: never mutate the result). */
const jsonCache = new Map();
function parse(v, fb) {
  if (typeof v !== "string") return fb;
  if (jsonCache.has(v)) return jsonCache.get(v);
  let out = fb; try { out = JSON.parse(v); } catch {}
  if (jsonCache.size > 200) jsonCache.clear();
  jsonCache.set(v, out); return out;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
/** Still in the room and heard from within the grace time (a backgrounded phone keeps its place). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── SCORING ─────────────────────────────────────────────────────────────────────────
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
/** The ring a point on the face scores (10 in the middle, 1 at the edge, 0 off the face) and whether it's an X (the inner ten). */
function ringAt(x, y) {
  const r = Math.sqrt(x * x + y * y), R = CONFIG.targetR;
  return { sc: r > R ? 0 : clamp(10 - Math.floor(r / (R / 10)), 1, 10), X: r <= R / 20 };
}
const total = (seat) => seat.sc.reduce((a, b) => a + b, 0);
/** Arrows this archer has shot in the current round. */
const shotThisRound = (g, s) => s.sc.length - g.round * CONFIG.arrowsPerRound;
/** Whose turn: the archer with the fewest arrows this round, the first one on a tie. -1 = the round is over. */
function currentSeat(g) {
  let best = -1, fewest = CONFIG.arrowsPerRound;
  g.seats.forEach((s, i) => { const n = shotThisRound(g, s); if (n < fewest) { fewest = n; best = i; } });
  return best;
}
/** Standings: highest total first, then most Xs. */
const ranked = (g) => g.seats.map((s, k) => ({ k, s, t: total(s) })).sort((a, b) => b.t - a.t || b.s.x - a.s.x);

// ── FLIGHT ──────────────────────────────────────────────────────────────────────────
// An arrow flies from the bow to the target in T seconds. Its path is a formula of time, so
// every client draws the same flight: it would land on the aim point, but gravity lifts and
// drops it on the way and the wind pushes it sideways the whole time.
const G = 9.8, BOW = { x: 0, y: 1.45, z: 0 }; // where arrows leave the bow
const distance = (g) => CONFIG.distances[Math.min(g.round, CONFIG.distances.length - 1)];
const flightTime = (d) => d / CONFIG.arrowSpeed;
/** How far the wind pushes an arrow sideways by the time it reaches the target. */
const drift = (d, wind) => 0.5 * CONFIG.windPush * wind * flightTime(d) ** 2;
/** The arrow at time t of a shot aimed at (ax, ay) on the face at distance d: position and direction. */
function arrowAt(d, ax, ay, wind, t) {
  const T = flightTime(d), aw = CONFIG.windPush * wind, ty = CONFIG.targetY + ay;
  return {
    x: BOW.x + ((ax - BOW.x) * t) / T + 0.5 * aw * t * t,
    y: BOW.y + ((ty - BOW.y) * t) / T + 0.5 * G * t * (T - t),
    z: -(d * t) / T,
    dx: (ax - BOW.x) / T + aw * t, dy: (ty - BOW.y) / T + 0.5 * G * (T - 2 * t), dz: -d / T,
  };
}
/** How long the flight is shown (short ones in slow motion). */
const showTime = (d) => Math.max(flightTime(d), CONFIG.minFlight);
/** The aim's wobble at time ms (it grows with distance). */
function sway(d, ms, seed = 0) {
  const a = CONFIG.sway + CONFIG.swayPerM * d, t = ms / 1000;
  return { x: a * (Math.sin(t * 1.3 + seed) * 0.7 + Math.sin(t * 2.9 + seed * 2) * 0.3), y: a * (Math.sin(t * 1.7 + seed * 3) * 0.6 + Math.sin(t * 3.7 + seed) * 0.4) };
}

// ── RANGE ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const cv = renderer.domElement;
const scene = new THREE.Scene();
function canvasTex(w, h, paint, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
scene.background = canvasTex(4, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#4b9fe0"); g.addColorStop(0.55, "#9ed4f2"); g.addColorStop(1, "#e6f4e0"); c.fillStyle = g; c.fillRect(0, 0, w, h); });
scene.fog = new THREE.Fog("#cfe8ec", 70, 190);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight("#ffffff", "#4d7a3a", 1.3));
const sun = new THREE.DirectionalLight("#fff4dc", 1.8);
sun.position.set(-12, 25, 8); sun.target.position.set(0, 0, -35); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 90 }); scene.add(sun, sun.target);

// Mowed grass in stripes, with a white line at every round's distance
const grass = canvasTex(64, 64, (c) => { c.fillStyle = "#6cbf4e"; c.fillRect(0, 0, 64, 64); c.fillStyle = "#63b346"; c.fillRect(0, 0, 64, 32); }, true);
grass.repeat.set(10, 26);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 220), new THREE.MeshStandardMaterial({ map: grass, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.z = -80; ground.receiveShadow = true; scene.add(ground);
const lineMat = new THREE.MeshBasicMaterial({ color: "#ffffff" });
const shootLine = new THREE.Mesh(new THREE.PlaneGeometry(14, 0.08).rotateX(-Math.PI / 2), lineMat); shootLine.position.y = 0.01; scene.add(shootLine);
function textSprite(text, color = "#fff", w = 256, h = 96, font = "900 56px system-ui, sans-serif") {
  const tex = canvasTex(w, h, (c) => { c.font = font; c.textAlign = "center"; c.textBaseline = "middle"; c.lineWidth = 8; c.strokeStyle = "#0008"; c.strokeText(text, w / 2, h / 2); c.fillStyle = color; c.fillText(text, w / 2, h / 2); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true })); return s;
}
for (const d of CONFIG.distances) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(10, 0.06).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.55 }));
  m.position.set(0, 0.01, -d); scene.add(m);
  const label = textSprite(`${d} m`); label.position.set(-5.6, 0.6, -d); label.scale.set(2.2, 0.82, 1); scene.add(label);
}
// Trees all around (the same for everyone: seeded), and hills
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const seeded = mulberry32(7), TREES = 140, mtx = new THREE.Matrix4();
const trees = new THREE.InstancedMesh(new THREE.ConeGeometry(2.2, 7, 8), new THREE.MeshStandardMaterial({ color: "#2f7a3a", flatShading: true }), TREES);
const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.35, 0.45, 2, 6), new THREE.MeshStandardMaterial({ color: "#7a4e2a" }), TREES);
for (let i = 0; i < TREES; i++) {
  const side = i % 3, s = 0.7 + seeded() * 0.9;
  const x = side === 2 ? (seeded() - 0.5) * 90 : (side ? 1 : -1) * (16 + seeded() * 22), z = side === 2 ? -95 - seeded() * 30 : 10 - seeded() * 120;
  mtx.compose(new THREE.Vector3(x, 1 + 3.5 * s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s)); trees.setMatrixAt(i, mtx);
  mtx.compose(new THREE.Vector3(x, s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s)); trunks.setMatrixAt(i, mtx);
}
trees.castShadow = true; scene.add(trees, trunks);
for (const [x, z, r] of [[-60, -160, 40], [30, -175, 50], [90, -140, 35]]) { const h = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 12), new THREE.MeshStandardMaterial({ color: "#7fb862", roughness: 1 })); h.scale.y = 0.35; h.position.set(x, -2, z); scene.add(h); }
// Wind flags on poles along the range: they stream the way the wind blows
const flags = [];
for (const [x, z] of [[-7, -12], [7, -28], [-7, -44], [7, -60]]) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 4, 6), new THREE.MeshStandardMaterial({ color: "#eeeeee" })); pole.position.set(x, 2, z); pole.castShadow = true; scene.add(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.8, 6, 1).translate(0.7, 0, 0), new THREE.MeshStandardMaterial({ color: "#ff5a3c", side: THREE.DoubleSide }));
  flag.position.set(x, 3.55, z); scene.add(flag); flags.push(flag);
}
// The target: a straw block on a wooden stand, the face with its rings
const ringTex = canvasTex(512, 512, (c, w) => {
  const cols = ["#f5f5f0", "#f5f5f0", "#222222", "#222222", "#2f8ee0", "#2f8ee0", "#e8392e", "#e8392e", "#ffd23f", "#ffd23f"];
  for (let k = 0; k < 10; k++) { c.beginPath(); c.arc(w / 2, w / 2, (w / 2) * (1 - k / 10) - 1, 0, 7); c.fillStyle = cols[k]; c.fill(); c.lineWidth = 2; c.strokeStyle = k === 2 || k === 3 ? "#ffffff88" : "#0005"; c.stroke(); }
  c.beginPath(); c.arc(w / 2, w / 2, w / 40, 0, 7); c.strokeStyle = "#0006"; c.stroke(); c.fillStyle = "#0006"; c.fillRect(w / 2 - 4, w / 2 - 1, 8, 2);
});
const target = new THREE.Group(); scene.add(target);
const straw = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.bossHalf * 2, CONFIG.bossHalf * 2, 0.4), new THREE.MeshStandardMaterial({ roughness: 1, map: canvasTex(64, 64, (c) => { c.fillStyle = "#d9b45b"; c.fillRect(0, 0, 64, 64); c.strokeStyle = "#b8923e"; for (let k = 0; k < 40; k++) { c.beginPath(); c.moveTo((k * 37) % 64, (k * 13) % 64); c.lineTo(((k * 37) % 64) + 10, ((k * 13) % 64) + 3); c.stroke(); } }) }));
straw.position.set(0, CONFIG.targetY, -0.2); straw.castShadow = true; target.add(straw);
const face = new THREE.Mesh(new THREE.CircleGeometry(CONFIG.targetR, 64), new THREE.MeshStandardMaterial({ map: ringTex, roughness: 0.8 }));

  if (performance.now() - lastTick > 1000) hostHold = performance.now() + 700; // the tab was frozen or in the background: let what the stand-in host wrote meanwhile arrive before acting as host
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick();
  const g = game();
  if (g) {
    const d = distance(g), k = currentSeat(g), seat = g.seats[k];
    target.position.z = -d;
    if (roundShown !== `${g.id}:${g.round}`) { // a new round: the target moves back
      roundShown = `${g.id}:${g.round}`; $("over").hidden = true;
      if (!ATTRACT && g.phase === "play") toast(`Round ${g.round + 1}<small>${d} metres</small>`, 1800);
    }
    // the arrows stuck in the target (rebuilt when the list changes)
    if (stuck.length !== g.hits.length || (stuck[0] && stuck[0].key !== `${g.id}:${g.round}`)) {
      for (const a of stuck) scene.remove(a.mesh); stuck.length = 0;
      for (const [s, x, y] of g.hits) { const m = makeArrow(g.seats[s] ? seatColor(g.seats[s]) : "#ccc"); const p = arrowAt(d, x, y, 0, flightTime(d)); placeArrow(m, x, CONFIG.targetY + y, -d - 0.06, p.dx, p.dy, p.dz); stuck.push({ mesh: m, key: `${g.id}:${g.round}` }); }
    }
    // the arrow in flight: drawn from the shot in state, the same path for everyone
    if (g.shot) me.fired = null;
    if (g.shot && (!flying || flying.n !== g.shot.n)) { if (flying) scene.remove(flying.mesh); flying = { n: g.shot.n, shot: g.shot, mesh: makeArrow(seatColor(g.seats[g.shot.s])), start: now, landed: false }; if (!ATTRACT) beep(900, 0.25, "sine", 0.05, 0.4); }
    if (!g.shot && flying) { scene.remove(flying.mesh); flying = null; }
    let flightT = -1;
    if (flying) {
      const sh = flying.shot, T = flightTime(d), hitFace = Math.abs(sh.hx) < CONFIG.bossHalf && Math.abs(sh.hy) < CONFIG.bossHalf;
      const t = Math.min(hitFace ? T : T * 1.4, ((now - flying.start) / 1000) * (T / showTime(d))); // a miss flies on past the target
      const p = arrowAt(d, sh.x, sh.y, sh.w, t);
      placeArrow(flying.mesh, p.x, p.y, hitFace ? Math.max(p.z, -d - 0.06) : p.z, p.dx, p.dy, p.dz);
      flying.mesh.visible = hitFace || t < T * 1.35;
      flightT = Math.min(1, t / T);
      if (t >= T && !flying.landed) {
        flying.landed = true;
        beep(sh.sc >= 9 ? 160 : 120, 0.12, "square", 0.12);
        const label = sh.sc === 0 ? (hitFace ? "Miss" : "Missed the target") : sh.X ? "X · Bullseye!" : sh.sc === 10 ? "10 · Bullseye!" : String(sh.sc);
        toast(`${label}<small>${esc(g.seats[sh.s].id === net.sessionId ? "You" : g.seats[sh.s].n)}</small>`, 1400);
        if (sh.sc >= 10) { burst(sh.hx, CONFIG.targetY + sh.hy, -d, ["#ffd23f", "#ff4d6d", "#ffffff", "#4dabff"], 60); beep(1040, 0.3, "sine", 0.1, 1.5); }
      }
    }
    // archers: whoever is up stands at the line; everyone else waits behind it
    const ids = new Set(g.seats.map((s) => s.id));
    for (const [id, a] of archers) if (!ids.has(id) || a.userData.color !== seatColor(g.seats.find((s) => s.id === id))) { scene.remove(a); archers.delete(id); }
    let wait = 0;
    const shooter = g.shot ? g.shot.s : k;
    g.seats.forEach((s, i) => {
      let a = archers.get(s.id);
      if (!a) { a = makeArcher(seatColor(s), s.id === net.sessionId ? "" : s.n); a.userData.color = seatColor(s); archers.set(s.id, a); }
      const up = i === shooter, u = a.userData, tx = up ? 0 : 1.5 + wait * 0.85, tz = up ? 0.75 : 1.9 + (wait % 2) * 0.35;
      if (!up) wait++;
      u.x += (tx - u.x) * Math.min(1, dt * 4); u.z += (tz - u.z) * Math.min(1, dt * 4);
      const drawingNow = up && (isDrawing(g, s, now) || (flightT >= 0 && flightT < 0.4));
      u.raise += ((drawingNow ? 1 : 0) - u.raise) * Math.min(1, dt * 8);
      a.position.set(u.x, 0, u.z); a.rotation.y = up ? Math.PI / 2 : Math.PI; // the shooter stands side-on, left shoulder to the target
      u.arm.rotation.z = u.raise * 1.55;
      a.visible = !(up && camMode === "scope"); // in the scope you look over your own shoulder
    });
    // the wind flags stream the way the wind blows
    flags.forEach((f, i) => { f.rotation.y = (g.wind < 0 ? Math.PI : 0) + Math.sin(now / 300 + i) * 0.12 * (1 + Math.abs(g.wind) * 0.2); f.rotation.x = Math.sin(now / 170 + i * 2) * 0.08 * Math.abs(g.wind); f.scale.y = 1 - 0.4 / (1 + Math.abs(g.wind)); });
    // the crosshair (mine while I draw, the shooter's while they draw)
    camMode = pickCamera(g, seat, d, now, flightT);
    const cross = $("cross");
    if (camMode === "scope" && seat) {
      const a = seat.id !== net.sessionId ? otherAim(g, seat, d, now) : me.drawing ? myAim(g) : me.fired || myAim(g);
      aimShown.x += (a.x - aimShown.x) * Math.min(1, dt * 12); aimShown.y += (a.y - aimShown.y) * Math.min(1, dt * 12);
      proj.set(aimShown.x, CONFIG.targetY + aimShown.y, -d).project(camera);
      cross.style.display = "block"; cross.style.color = cross.style.borderColor = seatColor(seat);
      cross.style.transform = `translate(${((proj.x + 1) / 2) * innerWidth}px, ${((1 - proj.y) / 2) * innerHeight}px)`;
    } else cross.style.display = "none";
    $("vignette").classList.toggle("on", camMode === "scope");
    if (me.drawing) publishAim(false);
    if (now - lastHud > 120) { lastHud = now; hud(g); }
  }
  tickConfetti(dt);
  const kk = camMode === "arrow" ? 1 : 1 - Math.pow(0.01, dt); // the arrow camera rides with the arrow; the rest glide
  cam.pos.lerp(want.pos, kk); cam.look.lerp(want.look, kk); cam.fov += (want.fov - cam.fov) * kk;
  camera.position.copy(cam.pos); camera.lookAt(cam.look); camera.fov = cam.fov; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
}
let camMode = "wide";
/** Is this archer drawing right now? Me: my own state. Others: their published `a`. Bots: the last part of their think time. */
function isDrawing(g, s, now) {
  if (g.shot || g.phase !== "play") return false;
  if (s.id === net.sessionId) return me.drawing || (!!me.fired && performance.now() - me.fired.at < 1500);
  if (s.bot) return Date.now() > g.turnAt + CONFIG.botThinkMs - CONFIG.botDrawMs;
  const a = parse(S.entities.players[s.id]?.a, null);
  return !!(a && a.k === g.shotN && a.d);
}
/** Someone else's crosshair: what they published, or for a bot a steady drift into the wind. */
function otherAim(g, s, d, now) {
  if (s.bot) { const w = sway(d, now, 1.7), into = Math.min(1, (Date.now() - (g.turnAt + CONFIG.botThinkMs - CONFIG.botDrawMs)) / 1200); return { x: -drift(d, g.wind) * into + w.x, y: w.y }; }
  const a = parse(S.entities.players[s.id]?.a, null);
  return a && a.k === g.shotN ? a : { x: 0, y: 0 };
}
/** Choose the camera for this moment and set where it wants to be. */
function pickCamera(g, seat, d, now, flightT) {
  if (flying) {
    const sh = flying.shot, p = arrowAt(d, sh.x, sh.y, sh.w, flightTime(d) * Math.min(1, flightT));
    if (flightT < 1 && p.z > -d + 5) { // chase the arrow
      want.pos.set(p.x + 0.14, p.y + 0.1, p.z + 0.85); want.look.set(p.x + p.dx * 0.06, p.y + p.dy * 0.06, p.z + p.dz * 0.06); want.fov = 50;
      return "arrow";
    }
    want.pos.set(0.45, CONFIG.targetY + 0.3, -d + 4.2); want.look.set(sh.hx * 0.4, CONFIG.targetY + sh.hy * 0.4, -d); want.fov = 40;
    return "target";
  }
  if (seat && g.phase === "play" && isDrawing(g, seat, now)) {
    want.pos.set(0, 1.55, 0.6); want.look.set(0, CONFIG.targetY, -d); want.fov = scopeFov(d);
    return "scope";
  }
  want.pos.set(0.6, 3.0, 8.2); want.look.set(0.2, 1.0, -Math.min(d, 24)); want.fov = camera.aspect < 1 ? 62 : 40; // behind the whole line
  return "wide";
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("shoot", (m, from) => { if (isHost()) hostShoot(from, m); });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "done") newMatch(g.id + 1); });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 4, botThinkMs: 1500, botDrawMs: 1050, holdMs: 1100, botAim: 0.03, botAimPerM: 0.001, botWindErr: 0.1 });
  want.pos.copy(cam.pos); want.look.copy(cam.look);
  requestAnimationFrame(frame);
})();
</script>
